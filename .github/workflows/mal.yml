name: Update MyAnimeList Activity

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    name: Update README with MAL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          comment_tag_name: "mal"
          # เปลี่ยน YOUR_MAL_USERNAME เป็นชื่อผู้ใช้ MyAnimeList ของคุณ
          feed_list: "https://myanimelist.net/rss.php?type=rw&u=TiMEZ4I3eth"
          max_post_count: 5 
